  *{box-sizing:border-box;}

  h1,h2,h3,.brand,nav.side .label{font-family:"Archivo","Segoe UI",sans-serif;}
  h1,h2,h3{text-wrap:balance; margin:0 0 .4em;}
  table{font-variant-numeric:tabular-nums;}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  a{color:var(--accent);}
  #app{display:flex; min-height:100%;}

  /* ---- sidebar ---- */
  .side{
    width:250px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    padding:20px 14px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .brand .mark{width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
  .brand .txt{line-height:1.15;}
  .brand .txt strong{display:block; font-size:15px; font-weight:800;}
  .brand .txt span{display:block; font-size:11.5px; color:var(--text-dim);}
  .side .group{margin:16px 0;}
  .side .label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); padding:0 10px 6px;}
  .side button.navlink{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font:inherit; font-size:14px; padding:9px 10px; border-radius:8px; cursor:pointer;
  }
  .side button.navlink .ic{width:20px; text-align:center; flex:none;}
  .side button.navlink:hover{background:var(--surface-2);}
  .side button.navlink[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:700;}

  /* ---- main ---- */
  .main{flex:1; min-width:0; padding:28px 34px 60px;}
  .topbar{display:none;}
  .pagehead{margin-bottom:22px;}
  .pagehead .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px;}
  .pagehead h1{font-size:26px; font-weight:800;}
  .pagehead p{color:var(--text-dim); margin:.35em 0 0; max-width:62ch;}
  section.view{display:none;}
  section.view[data-active="true"]{display:block;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px;}
  .card > h2{font-size:17px; font-weight:800; margin-bottom:2px;}
  .card > .sub{color:var(--text-dim); font-size:13.5px; margin-bottom:14px;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .tile .k{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:6px;}
  .tile .v{font-size:22px; font-weight:800;}
  .tile .d{font-size:12.5px; margin-top:4px; color:var(--text-dim);}
  .tile .d.up{color:var(--accent);}
  .tile .d.down{color:var(--danger);}

  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
  table.grid{border-collapse:collapse; width:100%; min-width:600px; font-size:13.5px;}
  table.grid th, table.grid td{padding:8px 12px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  table.grid thead th{position:sticky; top:0; background:var(--surface-2); color:var(--text-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; z-index:1;}
  table.grid tbody tr:hover{background:var(--surface-2);}
  table.grid tbody tr.total-row{font-weight:800; background:var(--surface-2);}
  table.grid td.num, table.grid th.num{text-align:right;}
  table.grid td.wrap{white-space:normal; min-width:260px; line-height:1.45;}
  .rank1{color:var(--gold); font-weight:800;}
  .pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:700;}
  .pill.up{background:var(--accent-soft); color:var(--accent);}
  .pill.down{background:var(--danger-soft); color:var(--danger);}
  .pill.flat{background:var(--surface-2); color:var(--text-dim);}

  .stagejump{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .stagejump a{font-size:12.5px; padding:6px 11px; border:1px solid var(--border); border-radius:99px; text-decoration:none; color:var(--text); background:var(--surface);}
  .stagejump a:hover{border-color:var(--accent); color:var(--accent);}
  .stage{margin-bottom:22px; scroll-margin-top:20px;}
  .stage h3{font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .stage h3 .no{background:var(--accent); color:var(--accent-ink); width:22px; height:22px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:12px;}
  .stage .body{font-size:14px; line-height:1.6; color:var(--text);}
  .stage .body p{margin:.6em 0;}

  .pathgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin:.8em 0; align-items:start;}
  .pathcard{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-size:13px; line-height:1.55;}
  .pathcard h4{margin:0 0 10px; font-size:14px; font-weight:800; color:var(--accent);}
  .pathcard .step{margin:0 0 10px;}
  .pathcard .step:last-child{margin-bottom:0;}
  .pathcard .step b{display:block; font-size:12.5px; color:var(--text);}
  .pathcard .offer{margin-top:14px; padding:11px 13px; background:var(--surface); border:1px dashed var(--accent); border-radius:7px;}
  .pathcard .offer .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:800; margin-bottom:7px; display:block;}
  .pathcard .offer ol, .pathcard .offer ul{margin:0; padding-left:18px;}
  .pathcard .offer li{margin-bottom:3px;}
  .pathcard .offer li:last-child{margin-bottom:0;}

  .formrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:10px;}
  .formrow label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px;}

  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .savemsg.ok{color:var(--accent);}
  .badge-added{font-size:11px; background:var(--accent-soft); color:var(--accent); padding:1px 7px; border-radius:99px; margin-left:6px;}

    .mobilebar{display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--border); padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;}

    .mobilebar strong{font-size:14px; font-family:"Archivo",sans-serif;}
    .scrim{display:none; position:fixed; inset:0; background:rgba(10,15,18,.4); z-index:15;}
    .scrim.show{display:block;}
    .main{padding:18px 16px 50px;}
    .pagehead h1{font-size:22px;}
  }
</style>

      '<div class="pathgrid">' +
        '<div class="pathcard"><h4>Client Has Not Started</h4>' +

          pathStep("Address Before Recommending","Resolve or address the reason for not starting first. If appropriate, recommend an approved related product based on their stated need.") +
          pathStep("If They Want to Wait","Offer a callback at the earliest reasonable time and tag <em>Call Later – Has Not Started</em>.") +
          pathStep("If They Decline","Respect the decision and tag <em>Changed Mind</em>.") +
          offerBox(["Offer the related product with a 40% discount."]) +
        '</div>' +
        '<div class="pathcard"><h4>Client Started Taking the Product but Has Not Finished</h4>' +

          pathStep("Respond Based on the Client's Experience","If the client is improving, reinforce consistent use and the importance of completing the intended course. If there's no improvement or the client has concerns, understand the situation first and follow the approved guidance.") +

          pathStep("Use Previous Usage as a Guide","Use the client's previous purchase and actual usage to guide the recommendation. The suggested quantity is only a guide and is not mandatory — the final decision always belongs to the client.") +
          pathStep("Explore Relevant Opportunities","If the client reports a negative experience, understand the reason first. Only recommend another product when it is relevant and approved. Ask whether a family member has a similar concern.") +

  }[active]();

  return '' +
  '<div class="mobilebar"><button id="navtoggle" aria-label="Open menu">☰</button><strong>'+esc(SECTIONS[active].title)+'</strong></div>' +
  '<div class="scrim" id="scrim"></div>' +
  '<aside class="side" id="sidenav">' +
    '<div class="brand"><div class="mark">☎️</div><div class="txt"><strong>Confirmation Desk</strong><span>Team ops hub</span></div></div>' +
    '<nav>'+renderNav(active, SECTIONS)+'</nav>' +
  '</aside>' +
  '<main class="main">' +
    '<div class="pagehead"><div class="eyebrow">'+esc(s.eyebrow)+'</div><h1>'+esc(s.title)+'</h1><p>'+esc(s.desc)+'</p></div>' +
    '<section class="view" data-active="true">'+viewHtml+'</section>' +
  '</main>';
}

function setActive(id){
  ACTIVE = id;
  document.getElementById('app').innerHTML = renderApp(STATE);
  attachHandlers();
  document.getElementById('app').scrollIntoView({block:'start'});
}

function attachHandlers(){
  var btns = document.querySelectorAll('[data-nav]');
  for (var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(e){ setActive(e.currentTarget.getAttribute('data-nav')); });
  }
  var toggle = document.getElementById('navtoggle');
  var side = document.getElementById('sidenav');
  var scrim = document.getElementById('scrim');
  if (toggle){
    toggle.addEventListener('click', function(){ side.classList.add('open'); scrim.classList.add('show'); });
    scrim.addEventListener('click', function(){ side.classList.remove('open'); scrim.classList.remove('show'); });
  }
  var form = document.getElementById('offform');
  if (form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var name = document.getElementById('f-name').value.trim();
      if (!name) return;
      var entry = {
        name: name,
        off1: document.getElementById('f-off1').value,
        off2: document.getElementById('f-off2').value,
        shift: document.getElementById('f-shift').value,
        reason: document.getElementById('f-reason').value.trim(),
        added: true
      };
      STATE.offRequests.push(entry);
      var submitBtn = document.getElementById('f-submit');
      var msg = document.getElementById('f-msg');
      submitBtn.disabled = true;
      msg.textContent = 'Adding…';
      msg.className = 'savemsg';
      setTimeout(function(){
        setActive('shifts');
        var m = document.getElementById('f-msg');
        if (m){ m.textContent = 'Added to this list on your device. Note: this file isn’t connected to a shared server, so this addition stays local to your browser — send a copy of what you typed to your supervisor to get it added for everyone.'; m.className = 'savemsg'; }
      }, 200);
    });
  }
}

function boot(){
  document.getElementById('app').innerHTML = renderApp(STATE);
  attachHandlers();
}
if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>

</body></html>
