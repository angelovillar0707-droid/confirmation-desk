<title>Remarketing Team</title>
<style id="page-style">
  :root{
    --bg:#eef6fb; --surface:#ffffff; --surface-2:#eaf4fb; --border:#cfe3f0;
    --text:#132635; --text-dim:#5b7c90; --accent:#0284c7; --accent-ink:#ffffff;
    --accent-soft:#e0f2fe; --warn:#a15c00; --warn-soft:#fbeed9; --danger:#b3261e;
    --danger-soft:#fbe6e3; --gold:#9a6b00; --gold-soft:#fbf1da; --silver:#5b6b76; --silver-soft:#eef1f3;
    --shadow:0 1px 2px rgba(15,50,70,.06),0 8px 24px rgba(15,50,70,.07);
    --radius:10px;
    --hero-grad:linear-gradient(135deg,#0284c7 0%,#38bdf8 55%,#7dd3fc 100%);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a1620; --surface:#0f2130; --surface-2:#152a3b; --border:#20394b;
      --text:#e6f2fa; --text-dim:#8db0c4; --accent:#38bdf8; --accent-ink:#052030;
      --accent-soft:#123349; --warn:#e3ab5c; --warn-soft:#2e2413; --danger:#f0796d;
      --danger-soft:#331e1c; --gold:#d9b154; --gold-soft:#3a2f12; --silver:#aebac1; --silver-soft:#1b2c38;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
      --hero-grad:linear-gradient(135deg,#0c3a56 0%,#0d5c86 55%,#1489c4 100%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1620; --surface:#0f2130; --surface-2:#152a3b; --border:#20394b;
    --text:#e6f2fa; --text-dim:#8db0c4; --accent:#38bdf8; --accent-ink:#052030;
    --accent-soft:#123349; --warn:#e3ab5c; --warn-soft:#2e2413; --danger:#f0796d;
    --danger-soft:#331e1c; --gold:#d9b154; --gold-soft:#3a2f12; --silver:#aebac1; --silver-soft:#1b2c38;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --hero-grad:linear-gradient(135deg,#0c3a56 0%,#0d5c86 55%,#1489c4 100%);
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand,nav.side .label{font-family:"Archivo","Segoe UI",sans-serif;}
  h1,h2,h3{text-wrap:balance; margin:0 0 .4em;}
  table{font-variant-numeric:tabular-nums;}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  a{color:var(--accent);}
  #app{display:flex; min-height:100%;}

  /* ---- sidebar ---- */
  .side{
    width:250px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    padding:20px 14px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .brand .mark{width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
  .brand .txt{line-height:1.15;}
  .brand .txt strong{display:block; font-size:15px; font-weight:800;}
  .brand .txt span{display:block; font-size:11.5px; color:var(--text-dim);}
  .side .group{margin:16px 0;}
  .side .label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); padding:0 10px 6px;}
  .side button.navlink{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font:inherit; font-size:14px; padding:9px 10px; border-radius:8px; cursor:pointer;
  }
  .side button.navlink .ic{width:20px; text-align:center; flex:none;}
  .side button.navlink:hover{background:var(--surface-2);}
  .side button.navlink[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:700;}

  /* ---- main ---- */
  .main{flex:1; min-width:0; padding:28px 34px 60px;}
  .topbar{display:none;}
  .pagehead{margin-bottom:22px;}
  .pagehead .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px;}
  .pagehead h1{font-size:26px; font-weight:800;}
  .pagehead p{color:var(--text-dim); margin:.35em 0 0; max-width:62ch;}
  section.view{display:none;}
  section.view[data-active="true"]{display:block;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px;}
  .card > h2{font-size:17px; font-weight:800; margin-bottom:2px;}
  .card > .sub{color:var(--text-dim); font-size:13.5px; margin-bottom:14px;}

  .hero{background:var(--hero-grad); border-radius:16px; padding:30px 32px; color:#fff; box-shadow:var(--shadow); margin-bottom:4px;}
  .hero-greeting{font-size:14px; font-weight:700; opacity:.9; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;}
  .hero-quote{font-size:22px; font-weight:700; line-height:1.45; max-width:62ch; text-wrap:balance;}
  .quicklinks{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px;}
  .qlink{display:flex; align-items:center; gap:10px; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:12px 14px; font:inherit; font-size:13.5px; font-weight:700; color:var(--text); cursor:pointer;}
  .qlink:hover{border-color:var(--accent); color:var(--accent);}
  .qlink-ic{font-size:17px; flex:none;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .tile .k{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:6px;}
  .tile .v{font-size:22px; font-weight:800;}
  .tile .d{font-size:12.5px; margin-top:4px; color:var(--text-dim);}
  .tile .d.up{color:var(--accent);}
  .tile .d.down{color:var(--danger);}

  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
  table.grid{border-collapse:collapse; width:100%; min-width:600px; font-size:13.5px;}
  table.grid th, table.grid td{padding:8px 12px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  table.grid thead th{position:sticky; top:0; background:var(--surface-2); color:var(--text-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; z-index:1;}
  table.grid tbody tr:hover{background:var(--surface-2);}
  table.grid tbody tr.total-row{font-weight:800; background:var(--surface-2);}
  table.grid td.num, table.grid th.num{text-align:right;}
  table.grid td.wrap{white-space:normal; min-width:260px; line-height:1.45;}
  .rank1{color:var(--gold); font-weight:800;}
  .rank2{color:var(--silver); font-weight:800;}
  table.grid tbody tr.top1{background:var(--gold-soft);}
  table.grid tbody tr.top2{background:var(--silver-soft);}
  table.grid tbody tr.top1:hover, table.grid tbody tr.top2:hover{background:var(--surface-2);}
  .pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:700;}
  .pill.up{background:var(--accent-soft); color:var(--accent);}
  .pill.down{background:var(--danger-soft); color:var(--danger);}
  .pill.flat{background:var(--surface-2); color:var(--text-dim);}

  .stagejump{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .stagejump a{font-size:12.5px; padding:6px 11px; border:1px solid var(--border); border-radius:99px; text-decoration:none; color:var(--text); background:var(--surface);}
  .stagejump a:hover{border-color:var(--accent); color:var(--accent);}
  .stage{margin-bottom:22px; scroll-margin-top:20px;}
  .stage h3{font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .stage h3 .no{background:var(--accent); color:var(--accent-ink); width:22px; height:22px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:12px;}
  .stage .body{font-size:14px; line-height:1.6; color:var(--text);}
  .stage .body p{margin:.6em 0;}
  .script{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:10px 14px; font-size:13.5px; font-style:italic; color:var(--text-dim); margin:.7em 0;}
  .pathgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin:.8em 0; align-items:start;}
  .pathcard{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-size:13px; line-height:1.55;}
  .pathcard h4{margin:0 0 10px; font-size:14px; font-weight:800; color:var(--accent);}
  .pathcard .step{margin:0 0 10px;}
  .pathcard .step:last-child{margin-bottom:0;}
  .pathcard .step b{display:block; font-size:12.5px; color:var(--text);}
  .pathcard .offer{margin-top:14px; padding:11px 13px; background:var(--surface); border:1px dashed var(--accent); border-radius:7px;}
  .pathcard .offer .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:800; margin-bottom:7px; display:block;}
  .pathcard .offer ol, .pathcard .offer ul{margin:0; padding-left:18px;}
  .pathcard .offer li{margin-bottom:3px;}
  .pathcard .offer li:last-child{margin-bottom:0;}

  .formrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:10px;}
  .formrow label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .formrow input, .formrow select{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text); font:inherit; font-size:13.5px;}
  .formrow input:focus, .formrow select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn{background:var(--accent); color:var(--accent-ink); border:none; padding:9px 16px; border-radius:8px; font:inherit; font-weight:700; font-size:13.5px; cursor:pointer;}
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .savemsg{font-size:12.5px; color:var(--text-dim); margin-top:8px; min-height:1.2em;}
  .savemsg.ok{color:var(--accent);}
  .badge-added{font-size:11px; background:var(--accent-soft); color:var(--accent); padding:1px 7px; border-radius:99px; margin-left:6px;}

  .mobilebar{display:none;}

  /* ---- sidebar: who-am-I + search ---- */
  .sidebox{margin:0 0 16px; padding:0 8px;}
  .sidebox .label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); padding:0 2px 6px;}
  .sidebox input{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text); font:inherit; font-size:13px;}
  .sidebox input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .whoami-row{display:flex; gap:6px; align-items:center;}
  .whoami-row input{flex:1;}
  .whoami-clear{flex:none; background:none; border:1px solid var(--border); border-radius:7px; width:32px; height:32px; color:var(--text-dim); cursor:pointer; font-size:13px;}
  .whoami-clear:hover{color:var(--text); border-color:var(--text-dim);}
  .whoami-hint{font-size:11.5px; color:var(--text-dim); margin-top:5px;}
  .searchwrap{position:relative;}
  .searchresults{position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); max-height:320px; overflow-y:auto; z-index:30;}
  .searchresults:empty{display:none;}
  .searchresult{display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--border); padding:9px 11px; cursor:pointer; font:inherit; color:var(--text);}
  .searchresult:last-child{border-bottom:none;}
  .searchresult:hover{background:var(--surface-2);}
  .searchresult .rtitle{font-size:12.5px; font-weight:800; color:var(--accent); margin-bottom:2px;}
  .searchresult .rsnippet{font-size:12px; color:var(--text-dim); line-height:1.4;}
  .searchresult .rsnippet mark{background:var(--accent-soft); color:var(--accent); font-weight:700; border-radius:2px;}
  .searchresult.empty{color:var(--text-dim); cursor:default; font-size:12.5px;}
  .searchresult.empty:hover{background:none;}

  tr.own-row td{background:var(--accent-soft)!important; font-weight:700; box-shadow:inset 3px 0 0 var(--accent);}

  @media (max-width:860px){
    #app{display:block;}
    .side{position:fixed; inset:0 auto 0 0; transform:translateX(-100%); transition:transform .2s ease; z-index:20; width:78vw; max-width:280px; box-shadow:var(--shadow);}
    .side.open{transform:translateX(0);}
    .mobilebar{display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--border); padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;}
    .mobilebar button{background:none; border:1px solid var(--border); border-radius:8px; width:36px; height:36px; font-size:16px; color:var(--text);}
    .mobilebar strong{font-size:14px; font-family:"Archivo",sans-serif;}
    .scrim{display:none; position:fixed; inset:0; background:rgba(10,15,18,.4); z-index:15;}
    .scrim.show{display:block;}
    .main{padding:18px 16px 50px;}
    .pagehead h1{font-size:22px;}
    /* 16px stops iOS Safari from auto-zooming the page when a field is
       focused  -  the desktop size (13.5px) is kept everywhere else. */
    .formrow input, .formrow select, .sidebox input{font-size:16px;}
  }
</style>

// Turns the ISO timestamp the refresh script stamps in (always UTC) into a
// friendly "Updated <date>, <time>" string in the viewer's own local time,
// plus a small badge for pages driven straight from the sheet.
function formatLastUpdated(){
  try {
    var d = new Date(LAST_UPDATED_ISO);
    if (isNaN(d.getTime())) return "";
    var dateStr = d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
    var timeStr = d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    return dateStr + ", " + timeStr;
  } catch (e) { return ""; }
}
function freshnessNote(){
  var when = formatLastUpdated();
  if (!when) return "";
  return '<div class="sub" style="margin-top:-10px;margin-bottom:16px;">\uD83D\uDD04 Synced from the Google Sheet \u2014 last updated '+esc(when)+'.</div>';
}

function remarketingView(){
  var jump = ['greet','discover','branch','close'].map(function(id,i){
    var labels=['1. Greeting','2. Discovery','3. Situation paths','4. Confirm & close'];
    return '<a href="#'+id+'">'+labels[i]+'</a>';
  }).join("");
  return '<div class="card">' +
    '<div class="stagejump">'+jump+'</div>' +
    stage(1,"Greeting & relationship check",
      pathStep("Greet & Confirm","Politely greet the customer, identify yourself and the company, and confirm you are speaking with the correct customer.") +
      pathStep("Reconnect With Previous Purchase","Mention the customer's previous order and establish familiarity with their history.") +
      pathStep("Explain the Purpose","Briefly explain that the call is to check on their experience and see if there is anything you can assist with.") +
      pathStep("Invite the Conversation","Give the customer an opportunity to respond naturally before moving into discovery or recommendations.") +
      '<div class="script">"Hello, good afternoon. May I speak with (CLIENT NAME)?"</div>' +
      '<div class="script">"Hi (CLIENT NAME), this is (AGENT NAME), Product Specialist from (COMPANY). We noticed that you previously ordered (PRODUCT NAME) from us, so I\u2019m reaching out to check how you\u2019re doing and how your experience has been so far."</div>' +
      '<div class="script">"We regularly follow up with our customers to see how they\u2019re doing and if there\u2019s anything we can assist you with."</div>',
      'greet') +
    stage(2,"Customer engagement & discovery",
      '<p>Reconnect with the customer and rebuild rapport first. Acknowledge their situation and ask how their experience has been so far. Understand whether they were able to use the product consistently, ask if they\u2019ve already finished using it, and explore how they felt after using it \u2014 listen carefully to their needs, concerns, and current status.</p>' +
      '<p>If the customer shows interest, need, or intent to repurchase, transition naturally into the recommendation or offer. If they\u2019re still undecided, offer support and continue the conversation without hard selling, and respect their response to keep the relationship warm.</p>' +
      '<p><strong>Before moving on:</strong> find out whether the client hasn\u2019t started the product yet, has started but not finished, or has already finished the previous order \u2014 that determines which path below to take.</p>',
      'discover') +
    stage(3,"Situation paths",
      '<div class="pathgrid">' +
        '<div class="pathcard"><h4>Client Has Not Started</h4>' +
          pathStep("Show Understanding","Acknowledge the client's situation and calmly ask why they have not started.") +
          pathStep("Understand the Need","Ask about their current concern and identify the main issue they want to address.") +
          pathStep("Address Before Recommending","Resolve or address the reason for not starting first. If appropriate, recommend an approved related product based on their stated need.") +
          pathStep("If They Want to Wait","Offer a callback at the earliest reasonable time and tag <em>Call Later \u2013 Has Not Started</em>.") +
          pathStep("If They Decline","Respect the decision and tag <em>Changed Mind</em>.") +
          offerBox(["Offer the related product with a 40% discount."]) +
        '</div>' +
        '<div class="pathcard"><h4>Client Started Taking the Product but Has Not Finished</h4>' +
          pathStep("Check the Client's Progress","Ask about the client's experience, consistency of use, remaining supply, and any improvements or concerns.") +
          pathStep("Respond Based on the Client's Experience","If the client is improving, reinforce consistent use and the importance of completing the intended course. If there's no improvement or the client has concerns, understand the situation first and follow the approved guidance.") +
          pathStep("If the Client Still Has Enough Product","Do not push an immediate refill. If appropriate, schedule <em>Call Later \u2013 Has Not Finished</em> closer to when the client is expected to complete their supply.") +
          pathStep("If the Client Is Nearly Finished","If the client is satisfied with the product, naturally transition into a refill discussion or a relevant product recommendation.") +
          pathStep("Use Previous Usage as a Guide","Use the client's previous purchase and actual usage to guide the recommendation. The suggested quantity is only a guide and is not mandatory \u2014 the final decision always belongs to the client.") +
          pathStep("Explore Relevant Opportunities","If the client reports a negative experience, understand the reason first. Only recommend another product when it is relevant and approved. Ask whether a family member has a similar concern.") +
          offerBox(["Previous 3 pcs \u2192 consider 2 pcs","Previous 2 pcs \u2192 consider 3 pcs","Previous 1 pc \u2192 consider 3 pcs","Previous 5+ pcs \u2192 reinforce consistent use or continuation when appropriate"]) +
        '</div>' +
        '<div class="pathcard"><h4>Client Not Improving</h4>' +
          pathStep("Understand the Client's Experience","Ask about product usage, consistency, previous supply, expected results, changes in their original concern, progress made, and any concerns or unwanted reactions.") +
          pathStep("Identify the Root Cause First","Avoid immediately recommending another quantity or product. First, determine why the client has not experienced the expected outcome.") +
          pathStep("Follow Approved Product Guidance","Based on the client's situation and the approved guidance, proceed with the appropriate recommendation, suggest a relevant related product, or escalate the concern when necessary.") +
          pathStep("Present the Appropriate Offer","When a recommendation is appropriate, present the offer using the current approved Offer Matrix, including the correct pricing and discounts.") +
          pathStep("Handle Hesitation Naturally and Professionally","Acknowledge their experience and explore the reason for their hesitation. Respond to the specific concern clearly and without pressure.") +
          pathStep("If the Client Declines","Respect the decision. If the reason is no money, offer a callback at the earliest reasonable date \u2014 no more than one callback attempt.") +
          pathStep("If Another Product Is Needed","Gather the necessary details and present the appropriate approved cross-sell.") +
          offerBox(["Offer 1: 3 pcs and 2 pcs, original price","Offer 2: 3 pcs and 2 pcs, with discount","Handle objection \u2192 offer another/related product, can be with discount right away"]) +
        '</div>' +
        '<div class="pathcard"><h4>Client Satisfied / Ready to Continue</h4>' +
          pathStep("Reinforce the Positive Experience","Acknowledge the client's positive experience and confirm their interest in continuing.") +
          pathStep("Recommend the Next Purchase","Use the client's previous purchase, actual usage, and current situation to guide the appropriate refill or continuation recommendation. Use only approved quantities and the current Offer Matrix for pricing and discounts.") +
          pathStep("Handle Hesitation Naturally","Acknowledge their experience and ask what's making them unsure about continuing. Address the specific concern and reinforce the relevant value without applying pressure.") +
          pathStep("If the Client Declines","Respect the client's decision. If the reason is no money, offer a callback only when appropriate \u2014 maximum one callback.") +
          pathStep("Explore Relevant Opportunities","If the client has another relevant need, gather the necessary information and present an appropriate approved cross-sell.") +
          offerBox(["Offer 1: 3 pcs, original price","Offer 2: 3 pcs with 40% discount","Offer 3: 2 pcs with 40% discount","Handle objection \u2192 offer another/related product, can be with discount right away"]) +
        '</div>' +
      '</div>',
      'branch') +
    stage(4,"Confirm details & close",
      pathStep("Confirm All Order Details First","Before proceeding, clearly repeat all the order details to the client to make sure the information is accurate.") +
      pathStep("Include Complete Order Information","Confirm: quantity ordered, product name, item price, delivery fee, total price, delivery address, delivery time to the client's area, email address, and client name.") +
      pathStep("Ask for Confirmation","After repeating the details, ask the client to confirm.") +
      pathStep("If the Information Is Correct","Proceed to clearly explain the delivery terms.") +
      pathStep("If the Information Is Incorrect","Ask which part is incorrect, clarify the correct details, and confirm the updated information before proceeding.") +
      '<div class="script">"So before we proceed with your order, let me clarify all the information first to make sure everything is correct."<br>"You bought (QUANTITY) bottle(s) of (PRODUCT NAME)."<br>"The price is (PRICE), the delivery fee is (DELIVERY FEE), so the total amount is (TOTAL PRICE)."<br>"It will be delivered to (CLIENT\u2019S ADDRESS), and the estimated delivery time to your area is (DELIVERY TIME)."<br>"Your name is (CLIENT\u2019S NAME), and your email address is (EMAIL)."<br>"Are all my informations correct?"</div>' +
      '<p>If yes: <em>"Thank you for confirming. Let me now explain the delivery terms clearly."</em><br>If no: <em>"Thank you for letting me know. May I ask which part is incorrect so I can correct it?"</em></p>',
      'close') +
  '</div>';
}

      'no-ack') +
    stage(3,"Clarify & discover",
      '<p>Naturally verify and explore: the customer name and product, the approximate order date, whether they or someone in their household may have placed the order, whether they previously signed up, inquired, or submitted information online about a related product, and if not, whether they currently experience a relevant concern.</p>' +
      '<div class="script">"No problem. Let me just clarify a few things with you. The request we have is for (PRODUCT), under your name, around (DATE). Does that sound familiar?"</div>' +
      '<div class="script">If no: "That\u2019s alright. Do you remember signing up or leaving your information online about any product related to (GENERAL CONCERN)?"</div>' +

        '<div class="pathcard"><h4>Genuine Unrecognized Order</h4></div>' +
        '</div>' +
      '<p><strong>Decision-maker check:</strong> if the customer IS the decision-maker, continue with the appropriate recovery/sales flow. If the customer is NOT the decision-maker, follow the Referral Opportunity process.</p>',
      'no-identify') +
    stage(5,"Handle the reason",
      '<div class="tablewrap"><table class="grid"><thead><tr><th>Reason</th><th>Action</th></tr></thead><tbody>' +
        '<tr><td>Changed Mind</td><td class="wrap">Understand the reason and address the concern when appropriate.</td></tr>' +
        '<tr><td>No Money</td><td class="wrap">If appropriate, offer a callback \u2014 maximum 1 callback.</td></tr>' +
        '<tr><td>Previous Interest</td><td class="wrap">Reconnect with the previous interest and present an appropriate offer.</td></tr>' +
        '<tr><td>Interested but Not Ready</td><td class="wrap">Understand the reason and offer the appropriate next step.</td></tr>' +
        '<tr><td>Not the Decision-Maker</td><td class="wrap">Identify the appropriate decision-maker and, when a relevant need exists, create a Referral Order and attempt to close it.</td></tr>' +
        '<tr><td>Genuine Unknown</td><td class="wrap">Respect the response and close the conversation professionally.</td></tr>' +
        '</tbody></table></div>' +

      'no-handle') +

        '<div class="pathcard"><h4>Other</h4></div>' +
        '</div>' +
      '<p><strong>Core principle:</strong> do not try to prove that the customer ordered. Identify the real reason and determine whether a legitimate sales opportunity exists.</p>',
      'no-disposition') +
    stage(8,"Summing up",
      '<p>Repeat all information to the client first to make sure everything you got is correct, including the delivery time to the client\u2019s area.</p>' +
      '<div class="script">"So before we proceed with your order, let me clarify all the information first to make sure everything is correct."<br>"You bought (QUANTITY) bottles of (PRODUCT NAME)."<br>"The price for that is (PRICE) and the delivery fee is (DELIVERY FEE), so the total would be (TOTAL PRICE)."<br>"It would be delivered at (CLIENT\u2019S ADDRESS). Your email is (EMAIL) and your name is (CLIENT\u2019S NAME)."<br>"Are all my informations correct?"</div>' +

function redeliveryAlgoView(){
  var jump = ['rd-prep','rd-open','rd-reconfirm','rd-objections','rd-close','rd-cross','rd-callback','rd-referral'].map(function(id,i){
    var labels=['1. Preparation','2. Opening','3. Offer reconfirmation','4. Objections','5. Summing up','6. Cross-sell','7. Callback protocol','8. Referral / recommendation'];
    return '<a href="#'+id+'">'+labels[i]+'</a>';
  }).join("");
  return '<div class="card">' +
    '<div class="stagejump">'+jump+'</div>' +
    stage(1,"Preparation",
      pathStep("Check the CRM Live While Greeting","Review product, quantity, and order date; last call notes; delivery status; and province/city coverage \u2014 in real time as the call connects.") +
      pathStep("Know the Gift and Promo","Understand this week's promo ladder (standard vs. 40% off), the matching cross-sell options, and the current gift offering before you dial.") +
      '<div class="script">Read the account the instant the call connects \u2014 a few seconds now avoids a cold, awkward open.</div>',
      'rd-prep') +
    stage(2,"Opening: no blame, no early price",
      '<p>The first 15 seconds decide whether the client wants to reconfirm or redeliver.</p>' +
      pathStep("Step 1 \u2014 Warm Greeting","Use their name, smile audibly, sound friendly.") +
      '<div class="script">"Magandang araw po! Si [name] po ito from [brand] Customer Care. Kausap ko po ba si Ma\u2019am/Sir [name]?"</div>' +
      pathStep("Step 2 \u2014 Why You're Calling","Tie the call to the client's own order history.") +
      '<div class="script">"Bumalik po kasi sa amin yung parcel niyo. Gusto ko lang po malaman kung ano\u2019ng nangyari."</div>' +
      pathStep("Step 3 \u2014 Ask Permission","Redirect blame toward logistics, not the client.") +
      '<div class="script">"Hindi po kayo natawagan ng rider, o hindi po kayo naabutan sa bahay?"</div>' +
      '<div class="script">Never skip the warmth. It will be hard for clients to warm up to us if we start with a low-energy, robotic approach.</div>',
      'rd-open') +
    stage(3,"Offer reconfirmation",
      '<p>State the amount once and in full here \u2014 not earlier. Always disclose the COD process audibly.</p>' +
      '<div class="script">"Ipadeliver na lang po ulit yung order niyo. Kung sakali po, ito po ung ating [product], [quantity], [amount] pesos po at Cash on Delivery po ito. Saka pa lang po tayo magbabayad kapag dumating na ang rider sa bahay niyo at hindi pa po ngayon."</div>',
      'rd-reconfirm') +
    stage(4,"Objections",
      '<p>If the client declines, work through all three cycles before ever considering a discount. There is no fourth cycle.</p>' +
      pathStep("Cycle 1 \u2014 Accept and Return the Benefit","Acknowledge the client, then restate that nothing is paid until the rider arrives.") +
      '<div class="script">"Naiintindihan ko po kayo. Pero wala pong bayad ngayon, pag dumating lang po sa inyo, saka pa lang po tayo magbabayad sa rider."</div>' +
      pathStep("Cycle 2 \u2014 Narrow to Logistics","Shift the objection toward scheduling rather than the purchase itself.") +
      '<div class="script">"Kayo po madalas nasa bahay? Kung magkataon man po na wala kayo sa bahay sa oras ng pagdeliver, basta po may ibang pwedeng magreceive at nasa kanya ang pera, pwede niya pong tanggapin ang delivery."</div>' +
      pathStep("Cycle 3 \u2014 Reduce Volume, One Step Only","Offer a single, smaller step down in quantity \u2014 never more than one reduction.") +
      '<div class="script">"Sige po, kunin niyo na lang po muna ang ating [smaller quantity] box para mas magaan."</div>' +
      pathStep("After Three Cycles","Offer a 40% discount if eligible, or schedule a callback within 14 days.") +
      offerBox(["Discount eligible only if ALL are true: the objection is price only (not time/family/distrust)","All three cycles were already completed","The original order came from a retention or remarketing flow","Orders from sales flows, or from retention/remarketing without an original discount, stay at regular price"]),
      'rd-objections') +
    stage(5,"Summing up",
      pathStep("Confirm the Full Summary","Product, quantity, final total, COD, address, and landmark.") +
      pathStep("Confirm Address","Complete address with landmark, plus email.") +
      pathStep("Confirm Name","Complete name.") +
      pathStep("Confirm Terms","Delivery terms and the amount to prepare.") +
      pathStep("Gift Announcement (after the client says yes)","") +
      '<div class="script">"May kasama pong maliit na regalo galing sa amin, hindi po ito bayad, thank you lang po sa tiwala. Ibibigay po ng rider kasabay ng order."</div>' +
      pathStep("Unknown-Caller Warning","") +
      '<div class="script">"Pag may tumawag po na hindi kilalang number, pasagot na lang po dahil kalimitan, rider po namin iyon."</div>' +
      pathStep("CRM Note Requirement","Log the real reason the first delivery failed, so it isn\u2019t repeated.") +
      '<div class="pathgrid">' +
        '<div class="pathcard"><h4>Gift presentation \u2014 do</h4>' +
          '<div class="step">Say it once, at the very end.</div>' +
          '<div class="step">Tie it to the client\u2019s action (confirmed address + email).</div>' +
          '<div class="step">Frame it as already inside the parcel.</div>' +
          '<div class="step">Log it in the CRM \u2014 one gift per customer.</div>' +
        '</div>' +
        '<div class="pathcard"><h4>Gift presentation \u2014 never</h4>' +
          '<div class="step">Mention it before the client says yes (that is bait).</div>' +
          '<div class="step">Offer it as an answer to an objection (teaches resistance pays).</div>' +
          '<div class="step">Name its price or use the word "worth".</div>' +
          '<div class="step">Mention it in the same sentence as a discount.</div>' +
          '<div class="step">Use the words: <em>libre, promo, discount, bonus, palit</em> anywhere near it \u2014 they shift focus to money.</div>' +
        '</div>' +
      '</div>',
      'rd-close') +
    stage(6,"Cross-sell",
      '<p>Cross-sell only if the client agreed immediately at Step 3 (Offer Reconfirmation) and the close was easy. If all three objection cycles were used, or the client refused the first offer, skip cross-sell entirely and move straight to Summing Up.</p>',
      'rd-cross') +
    stage(7,"Callback protocol",
      pathStep("When to Set a Callback","Client is busy, not around, or has no money right now.") +
      pathStep("Max Hold Duration","Busy / not around: 24 hours only. No money: maximum 14 days, one time in a row. Always give a specific date and time.") +
      '<div class="script">"Naiintindihan ko po. Ang promo po namin, maximum 14 days lang po naming ma-hold. Pwede po ba tawagan kita sa [Day], [Date]? ... Sige po, salamat sa oras niyo. Ingat po kayo, God bless!"</div>' +
      pathStep("CRM Action","Set status to \u201CCall Later.\u201D Write clear notes: what was discussed, what the customer said, and what to offer next time."),
      'rd-callback') +
    stage(8,"Referral / recommendation",
      pathStep("When to Use Referral","The client is not the product user themself \u2014 ask if a relative, friend, or acquaintance has a similar concern.") +
      pathStep("When to Use Recommendation","Always attempt before the call ends.") +
      '<div class="script">"Sir/Ma\u2019am, matanong ko na lang rin po, may mga kakilala, kamag-anak, o kaibigan po ba kayo na may nararamdaman ding ganito sa kanilang katawan? Maaari po namin silang tawagan para matulungan din po namin sila."</div>' +
      '<p>Then proceed to information gathering and follow the standard Referral Rules and Guidelines.</p>',
      'rd-referral') +
  '</div>';
}

var VIEW_FNS = {
  home: homeView,
  ranking: rankingView, performance: performanceView,
  leaveTracker: leaveTrackerView,
  remarketing: remarketingView, notordered: notOrderedView, redeliveryAlgo: redeliveryAlgoView,
  gifts: giftsView, redelivery: redeliveryView, callbacks: callbacksView
};

function renderApp(state){
  var active = ACTIVE || "home";
  var s = SECTIONS[active];
  var viewHtml = VIEW_FNS[active]();

  return '' +
  '<div class="mobilebar"><button id="navtoggle" aria-label="Open menu">\u2630</button><strong>'+esc(SECTIONS[active].title)+'</strong></div>' +
  '<div class="scrim" id="scrim"></div>' +
  '<aside class="side" id="sidenav">' +
    '<div class="brand"><div class="mark">\u2601\uFE0F</div><div class="txt"><strong>Remarketing Team</strong><span>Every call is a fresh start</span></div></div>' +
    '<div class="sidebox">' +
      '<span class="label">Your name</span>' +
      '<div class="whoami-row">' +
        '<input id="who-input" list="who-list" maxlength="60" placeholder="e.g. Sharon SanJuan" value="'+esc(AGENT_NAME)+'">' +
        '<button type="button" class="whoami-clear" id="who-clear" title="Clear" aria-label="Clear your name">\u2715</button>' +
      '</div>' +
      '<datalist id="who-list">'+agentDatalistOptions()+'</datalist>' +
      '<div class="whoami-hint">Remembered on this device \u2014 highlights your row in Ranking & fills your name on forms.</div>' +
    '</div>' +
    '<div class="sidebox searchwrap">' +
      '<span class="label">Search</span>' +
      '<input id="site-search" autocomplete="off" placeholder="\uD83D\uDD0D Search scripts, reasons, pricing\u2026">' +
      '<div class="searchresults" id="search-results"></div>' +
    '</div>' +
    '<nav>'+renderNav(active, SECTIONS)+'</nav>' +
  '</aside>' +
  '<main class="main">' +
    '<div class="pagehead"><div class="eyebrow">'+esc(s.eyebrow)+'</div><h1>'+esc(s.title)+'</h1><p>'+esc(s.desc)+'</p></div>' +
    '<section class="view" data-active="true">'+viewHtml+'</section>' +
  '</main>';
}

function setActive(id, searchTerm){
  ACTIVE = id;
  document.getElementById('app').innerHTML = renderApp();
  attachHandlers();
  document.getElementById('app').scrollIntoView({block:'start'});
  // If we landed here from a search result, try to scroll the browser's
  // own text search to the first match so it's not just "somewhere on this
  // long page"  -  window.find is non-standard but works in every
  // Chromium/Firefox build agents are likely using; if it's unsupported
  // anywhere, this just quietly does nothing and the page still navigated.
  if (searchTerm && typeof window.find === 'function'){
    setTimeout(function(){
      try { window.find(searchTerm, false, false, true, false, true, false); } catch (e) { /* ignore */ }
    }, 60);
  }
}

// ---- site search ----
// Built once, lazily, by rendering every section's view function and
// stripping its HTML down to plain text. Views are pure functions of the
// global state (RANKING, PERF, LEAVE_STATE, ...) so calling them here for
// indexing has no side effects on ACTIVE or the currently visible page.
var SEARCH_INDEX = null;
function stripTags(html){
  return String(html)
    .replace(/<[^>]*>/g," ")
    .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&#39;/g,"'").replace(/&quot;/g,'"')
    .replace(/\s+/g," ").trim();
}
function buildSearchIndex(){
  if (SEARCH_INDEX) return SEARCH_INDEX;
  SEARCH_INDEX = Object.keys(VIEW_FNS).map(function(id){
    var html = "";
    try { html = VIEW_FNS[id](); } catch (e) { html = ""; }
    return { id: id, title: SECTIONS[id].label, text: stripTags(html) };
  });
  return SEARCH_INDEX;
}
function searchSnippet(text, query){
  var lower = text.toLowerCase();
  var at = lower.indexOf(query.toLowerCase());
  if (at === -1) return "";
  var start = Math.max(0, at - 45);
  var end = Math.min(text.length, at + query.length + 65);
  var snippet = (start > 0 ? "\u2026" : "") + text.slice(start, end) + (end < text.length ? "\u2026" : "");
  var re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "ig");
  return esc(snippet).replace(re, "<mark>$1</mark>");
}
function renderSearchResults(query, container){
  query = query.trim();
  if (query.length < 2){ container.innerHTML = ""; return; }
  var index = buildSearchIndex();
  var matches = index
    .filter(function(entry){ return entry.text.toLowerCase().indexOf(query.toLowerCase()) !== -1; })
    .slice(0, 8);
  if (!matches.length){
    container.innerHTML = '<div class="searchresult empty">No matches on the site for \u201C'+esc(query)+'\u201D.</div>';
    return;
  }
  container.innerHTML = matches.map(function(m){
    return '<button type="button" class="searchresult" data-jump="'+esc(m.id)+'" data-term="'+esc(query)+'">' +
      '<div class="rtitle">'+esc(m.title)+'</div>' +
      '<div class="rsnippet">'+searchSnippet(m.text, query)+'</div>' +
    '</button>';
  }).join("");
  var btns = container.querySelectorAll('[data-jump]');
  for (var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(e){
      var id = e.currentTarget.getAttribute('data-jump');
      var term = e.currentTarget.getAttribute('data-term');
      setActive(id, term);
    });
  }
}

function attachHandlers(){
  var btns = document.querySelectorAll('[data-nav]');
  for (var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(e){ setActive(e.currentTarget.getAttribute('data-nav')); });
  }
  var toggle = document.getElementById('navtoggle');
  var side = document.getElementById('sidenav');
  var scrim = document.getElementById('scrim');
  if (toggle){
    toggle.addEventListener('click', function(){ side.classList.add('open'); scrim.classList.add('show'); });
    scrim.addEventListener('click', function(){ side.classList.remove('open'); scrim.classList.remove('show'); });
  }

  var whoInput = document.getElementById('who-input');
  var whoClear = document.getElementById('who-clear');
  if (whoInput){
    whoInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ whoInput.blur(); } });
    whoInput.addEventListener('change', function(){
      AGENT_NAME = whoInput.value.trim();
      saveAgentName(AGENT_NAME);
      setActive(ACTIVE);
    });
  }
  if (whoClear){
    whoClear.addEventListener('click', function(){
      AGENT_NAME = "";
      saveAgentName("");
      setActive(ACTIVE);
    });
  }

  var searchInput = document.getElementById('site-search');
  var searchResults = document.getElementById('search-results');
  if (searchInput && searchResults){
    searchInput.addEventListener('input', function(){ renderSearchResults(searchInput.value, searchResults); });
    searchInput.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ searchInput.value=''; searchResults.innerHTML=''; searchInput.blur(); } });
  }
  // Bound once on document (not per-render, since document persists across
  // setActive() re-renders and re-binding here would stack up listeners) -
  // reads the CURRENT search box/results from the DOM at click time instead
  // of closing over the ones from whichever render first attached it.
  if (!DOC_CLICK_BOUND){
    DOC_CLICK_BOUND = true;
    document.addEventListener('click', function(e){
      var sr = document.getElementById('search-results');
      var si = document.getElementById('site-search');
      if (sr && !sr.contains(e.target) && e.target !== si) sr.innerHTML = '';
    });
  }

  // Shared by the Day-off, Leave, and Referral forms: pushes the entry into
  // its local array right away (so the table updates instantly for the
  // person typing), then  -  if a Web App URL is configured  -  also POSTs it
  // to the shared sheet, and swaps the status message once that finishes.
  function submitToSheet(opts){
    var submitBtn = document.getElementById(opts.submitId);
    var msgId = opts.msgId;
    submitBtn.disabled = true;
    var msg = document.getElementById(msgId);
    msg.textContent = 'Adding\u2026';
    msg.className = 'savemsg';

    var localOnlyMsg = 'Added to this list on your device. Note: this file isn\u2019t connected to a shared server, so this addition stays local to your browser \u2014 send a copy of what you typed to your supervisor to get it added for everyone.';
    var savedMsg = opts.savedMsg || 'Added \u2014 and saved to the shared sheet.';
    var failedMsg = 'Added to this list on your device, but saving to the shared sheet failed \u2014 please also send a copy of what you typed to your supervisor.';

    function finish(text){
      setActive(opts.viewId);
      var m = document.getElementById(msgId);
      if (m){ m.textContent = text; m.className = 'savemsg'; }
    }

    if (INTAKE_URL) {
      fetch(INTAKE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(opts.entry)
      }).then(function(res){ return res.json ? res.json() : {}; })
        .then(function(resp){ finish(resp && resp.status === 'ok' ? savedMsg : failedMsg); })
        .catch(function(){ finish(failedMsg); });
    } else {
      setTimeout(function(){ finish(localOnlyMsg); }, 200);
    }
  }

  var doForm = document.getElementById('doform');
  if (doForm){
    doForm.addEventListener('submit', function(e){
      e.preventDefault();
      var name = document.getElementById('do-name').value.trim();
      if (!name) return;
      var entry = {
        type: 'dayoff',
        name: name,
        off1: document.getElementById('do-off1').value,
        off2: document.getElementById('do-off2').value,
        shift: document.getElementById('do-shift').value,
        reason: document.getElementById('do-reason').value.trim(),
        added: true
      };
      DAYOFF_STATE.dayOffRequests.push(entry); SEARCH_INDEX = null;
      submitToSheet({
        entry: entry, submitId: 'do-submit', msgId: 'do-msg', viewId: 'leaveTracker',
        savedMsg: 'Added \u2014 and saved to the shared Day-off list.'
      });
    });
  }
  var leaveForm = document.getElementById('leaveform');
  if (leaveForm){
    leaveForm.addEventListener('submit', function(e){
      e.preventDefault();
      var name = document.getElementById('l-name').value.trim();
      var reason = document.getElementById('l-reason').value.trim();
      if (!name || !reason) return;
      var entry = {
        type: 'leave',
        name: name,
        start: document.getElementById('l-start').value.trim(),
        end: document.getElementById('l-end').value.trim(),
        reason: reason,
        added: true
      };
      LEAVE_STATE.leaveRequests.push(entry); SEARCH_INDEX = null;
      submitToSheet({
        entry: entry, submitId: 'l-submit', msgId: 'l-msg', viewId: 'leaveTracker',
        savedMsg: 'Added \u2014 and saved to the shared Leave Requests list.'
      });
    });
  }
  var refForm = document.getElementById('refform');
  if (refForm){
    refForm.addEventListener('submit', function(e){
      e.preventDefault();
      var agent = document.getElementById('rf-agent').value.trim();
      var prevClient = document.getElementById('rf-prevclient').value.trim();
      var name = document.getElementById('rf-name').value.trim();
      if (!agent || !prevClient || !name) return;
      var entry = {
        type: 'referral',
        agent: agent,
        prevHash: document.getElementById('rf-hash').value.trim(),
        prevClient: prevClient,
        name: name,
        contact: document.getElementById('rf-contact').value.trim() || '\u2014',
        address: document.getElementById('rf-address').value.trim(),
        relation: document.getElementById('rf-relation').value.trim(),
        product: document.getElementById('rf-product').value.trim(),
        added: true
      };
      REFERRALS.push(entry); SEARCH_INDEX = null;
      submitToSheet({
        entry: entry, submitId: 'rf-submit', msgId: 'rf-msg', viewId: 'callbacks',
        savedMsg: 'Added \u2014 and saved to the shared Manual Callback sheet.'
      });
    });
  }
}

function boot(){
  document.getElementById('app').innerHTML = renderApp();
  attachHandlers();
}
if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
