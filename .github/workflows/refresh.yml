name: Refresh from Google Sheet

on:
  schedule:
    # 12:00 AM and 12:00 PM Manila time (UTC+8) = 16:00 and 04:00 UTC
    - cron: "0 4,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild index.html from the Sheet
        run: node scripts/refresh.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes — index.html already up to date."
            exit 0
          fi
          git config user.name "confirmation-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-refresh from Google Sheet"
          git push
